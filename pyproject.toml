[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faadjou-ai"
version = "0.1.0"
description = "Faadjou Wax (triage vocal wolof) + Sentinelle (alerte climat-santé)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
